name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable .
      - run: python -m unittest discover -s tests -q
      - run: python -m authzloom.cli plan examples/rest.json
      - run: python -m authzloom.cli plan examples/graphql.json
      - run: python -m authzloom.cli plan examples/rest.json --explain
      - name: Verify MCP tool surface
        shell: python
        run: |
          import json
          from authzloom.mcp_server import TOOLS
          expected = {
              "authzloom_ingest", "authzloom_plan", "authzloom_run",
              "authzloom_status", "authzloom_export",
          }
          assert {tool["name"] for tool in TOOLS} == expected
      - name: Fake-clock benchmarks
        run: python -m authzloom.bench

  java-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and smoke independent bridge classes
        run: |
          SRC=burp-extension/src/main/java/io/authzloom
          javac --release 21 -d /tmp/authzloom-j $SRC/BoundedJson.java $SRC/CaptureStore.java $SRC/TokenCompare.java $SRC/HttpOverlay.java $SRC/BoundedJsonSmoke.java
          java -cp /tmp/authzloom-j io.authzloom.BoundedJsonSmoke
